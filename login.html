{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center animate-fade">
    <div class="col-md-6">
        <div class="card auth-card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-blue-gradient py-5 text-center text-white">
                <h2 class="fw-black mb-0">WELCOME ALL! 👋</h2>
                <small class="opacity-75">Your secret hunting equipment is waiting...</small>
            </div>
            <div class="card-body p-5">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="form-floating mb-3">
                        <input type="text" name="username" class="form-control bg-black text-white" id="uInput"
                            placeholder="Username" required>
                        <label for="uInput" class="text-white-50"><i class="fas fa-user me-2 text-primary"></i>
                            Username</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" name="password" class="form-control bg-black text-white" id="pInput"
                            placeholder="Password" required>
                        <label for="pInput" class="text-white-50"><i class="fas fa-key me-2 text-primary"></i>
                            Password</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit"
                            class="btn btn-primary-gradient py-3 fw-black rounded-pill shadow-lg hover-scale">
                            ENTER THE LAB! 🧪 <i class="fas fa-flask-vial ms-2"></i>
                        </button>
                    </div>
                </form>
                <div class="text-center mt-4 pt-3 border-top border-secondary">
                    <a href="{{ url_for('forgot_password') }}" class="text-decoration-none text-muted small me-3">Forgot
                        Credentials?</a>
                    <a href="{{ url_for('register') }}" class="text-decoration-none text-accent fw-bold small">Create
                        Account</a>
                </div>
                <div class="text-center mt-3">
                    <a href="{{ url_for('admin_login') }}" class="text-decoration-none text-danger small">
                        <i class="fas fa-user-shield me-1"></i> Are you an Admin? Access here
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
